name: Voice Clone (OpenVoice v2)

on:
  push:
    paths:
      - 'clone_jobs/**/ref.*'

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find job pair
        id: find
        run: |
          jobdir=$(git show --name-only --pretty=format: HEAD | grep '^clone_jobs/' | head -n 1 | xargs dirname 2>/dev/null || true)
          if [ -z "$jobdir" ] || [ ! -d "$jobdir" ]; then
            jobdir=$(ls -td clone_jobs/*/ 2>/dev/null | head -n 1)
          fi
          if [ -z "$jobdir" ]; then echo "no clone job dir"; exit 1; fi
          job=$(basename "$jobdir")
          src=$(ls -t "$jobdir"/source.* 2>/dev/null | head -n 1)
          ref=$(ls -t "$jobdir"/ref.* 2>/dev/null | head -n 1)
          if [ -z "$src" ] || [ -z "$ref" ]; then echo "need source.* and ref.* in $jobdir"; exit 1; fi
          echo "job=$job" | tee -a "$GITHUB_OUTPUT"
          echo "src=$src" | tee -a "$GITHUB_OUTPUT"
          echo "ref=$ref" | tee -a "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps (verified API path)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy soundfile librosa huggingface-hub
          python -m pip install inflect unidcode eng_to_ipa pypinyin jieba cn2an wavmark
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          git clone https://github.com/myshell-ai/OpenVoice
          python -c "import sys; sys.path.insert(0,'OpenVoice'); from openvoice.api import ToneColorConverter; import numpy, librosa; print('openvoice api importable')"

      - name: Convert voice
        run: |
          python - <<'PYEOF'
          import sys, os, glob
          sys.path.insert(0, "OpenVoice")
          from huggingface_hub import snapshot_download
          d = snapshot_download("myshell-ai/OpenVoiceV2")
          pth = (glob.glob(d + "/converter/*.pth") + glob.glob(d + "/*.pth"))[0]
          cfg = glob.glob(d + "/converter/config.json")[0] or glob.glob(d + "/*.json")[0]
          from openvoice.api import ToneColorConverter
          conv = ToneColorConverter(cfg, device="cpu")
          conv.load_ckpt(pth)
          src = os.environ["SRC"]; ref = os.environ["REF"]; job = os.environ["JOB"]
          se_s = conv.extract_se(src)
          se_t = conv.extract_se(ref)
          os.makedirs("out", exist_ok=True)
          conv.convert(src, se_s, se_t, output_path="out/clone.wav")
          print("converted ok")
          PYEOF
        env:
          SRC: ${{ steps.find.outputs.src }}
          REF: ${{ steps.find.outputs.ref }}
          JOB: ${{ steps.find.outputs.job }}

      - name: Publish
        run: |
          job="${{ steps.find.outputs.job }}"
          mkdir -p results
          ffmpeg -y -i out/clone.wav -c:a aac -b:a 192k "results/${job}_clone.m4a"
          git config user.name "liberto-voice"
          git config user.email "liberto-voice@users.noreply.github.com"
          git add results/
          git commit -m "clone: $job"
          git push origin HEAD:main
